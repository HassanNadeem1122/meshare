<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meshare Bounce</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <span class="logo">◉ meshare</span>
      <span class="tag">hosted P2P — no server anywhere</span>
    </header>

    <h1>BOUNCE<span class="dot-accent">.</span></h1>

    <div class="hud">
      <div class="pill dark"><span class="k">score</span><span class="v" id="score">0</span></div>
      <div class="pill yellow"><span class="k">time</span><span class="v" id="time">30</span></div>
      <div class="pill"><span class="k">best</span><span class="v" id="best">0</span></div>
    </div>

    <div class="stage">
      <div class="stripe"></div>
      <div class="stage-inner">
        <canvas id="c" width="640" height="380"></canvas>
        <div id="overlay">
          <div class="big" id="ov-title">CLICK THE BALL</div>
          <div class="small" id="ov-sub">30 seconds · every hit makes it faster · misses cost 2s</div>
          <button id="start">▶&nbsp; play</button>
        </div>
      </div>
    </div>

    <footer>every visitor of this page is also hosting it for the next one</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
